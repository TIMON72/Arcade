[tvon]
# HDMI-CEC: автозапуск ТВ при старте Batocera (поэтапный контроль + recovery)
enabled = true
# CEC logical address телевизора (обычно 0)
device = 0
# Имя устройства на шине CEC (вместо дефолтного CECTester)
osd_name = "Arcade"
# Physical address CEC: auto = из scan / по порту (A-1→1.0.0.0, A-2→2.0.0.0)
physical_address = "auto"
# DRM-выход: auto = HDMI-A-1 или HDMI-A-2 (что connected); либо "HDMI-A-1,HDMI-A-2"
hdmi_output = "auto"
# Пауза перед первой попыткой (Pi часто встаёт раньше ТВ)
initial_delay_sec = 10
# Пауза между попытками включения
interval_sec = 5
# Сколько всего ждать power=on (сек)
max_wait_sec = 180
# Сколько ждать DRM HDMI connected после power=on
hdmi_wait_sec = 60
# Пауза после power=on/HDMI перед claim (ТВ ещё «просыпается»)
settle_sec = 15
# Повторы claim-сессии (as + Image View On + Active Source)
claim_retries = 3
claim_interval_sec = 3
# Сколько держать cec-client открытым после as (иначе Active Source сбрасывается)
claim_hold_sec = 15
# После закрытия cec-client: повторный scan Active Source + re-claim если unknown/-1
active_source_retries = 3
active_source_recheck_sec = 3
# Держать CEC-сессию после claim (иначе ТВ сбрасывает Active Source в unknown/-1).
# Секунды удержания ПОСЛЕ успешного supervise (во время этапов keeper живёт до stop).
active_source_keep_sec = 120
# После CEC — batocera-resolution setOutput (чинит чёрный экран после boot без ТВ)
refresh_display = true
# Звук: soft set-profile/set; hard S06 только если после soft-wait всё ещё fail
refresh_audio = true
audio_hard_restart = true
# Сколько ждать soft (сек), прежде чем эскалировать на S06. 0 = сразу hard после 1 soft.
audio_soft_wait_sec = 45
# Перед setOutput / S06: пульсировать /tmp/no-hotplug (штатный escape Batocera),
# чтобы DRM HOTPLUG не слал curl /quit в ES. 0 = выкл. Не трогает udev.
hotplug_suppress_sec = 20
# Безусловный ES restart — last resort на stage picture (опасно на Pi5+NVMe)
restart_es = false
# После успешных этапов: ES restart ТОЛЬКО если при старте settled display list был [ ]
# (медленный ТВ / ES поднялся без HDMI). Быстрый ТВ с уже заполненным списком — skip.
restart_es_if_empty = true
es_restart_settle_sec = 8
# Повторы setOutput / picture / audio stages
display_retries = 5
display_retry_sec = 3
picture_retries = 5
# Soft wait then hard S06 — не больше audio_retries (cap 2)
audio_retries = 2
# Короткий post-check после stage 4 (картинка не отвалилась)
post_check_attempts = 2
post_check_sec = 8
# Уровень отладки cec-client (-d)
cec_debug = 1
