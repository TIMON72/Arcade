[timer]
# Режим: Raspberry (Pi — хозяин реле/таймера) или Arduino (Pi имитирует радио → Arduino)
timer_mode = "Arduino"

# Шаг увеличения времени кнопкой "+" (минуты)
time_step = 5

# Пауза после окончания отсчёта перед следующим действием (секунды)
time_wait = 60

# Автосброс, если время выставлено, но игра не запущена (минуты)
time_reset = 5

# Unix datagram: команды от сервиса server (modules/timer.py)
cmd_socket = "/var/run/arcade-timer.sock"

[gpio]
# Пины RF (BCM): в режиме Raspberry — входы пульта; в Arduino — выходы «имитация радио»
rf_increase = 5      # "+"
rf_playpause = 6     # Play/Pause
rf_stop = 13         # Stop

# Пины реле (BCM): в режиме Raspberry — выходы на автомат; в Arduino — входы состояния
r_buttons = 17       # IN1–IN6
r_playpause = 27     # IN7
r_stop = 22          # IN8

# true = реле включается уровнем LOW (как в Arduino-проекте)
relay_active_low = true

[terminal]
# Сухой контакт безналичной оплаты (как TERM_OUT_CASHLESS в Arduino 0.21)
# BCM 26 = физ. 37, GND = физ. 39. Замыкание на GND → импульс LOW.
enabled = true
pin = 26
active_high = false  # покой=1 (pull-up), импульс=0 (замыкание на GND)
# Фильтр дребезга, мс (0 = без фильтра; меньше длительности импульса терминала)
debounce_ms = 0
# Пауза после серии импульсов до автозапуска игры, мс
start_delay_ms = 2000

[matrix]
enabled = true
brightness = 7
scroll_speed = 7
text_display = "АРЕНДА: т. +79233549295"

# Bitbang SPI по пинам din/clk/cs (BCM / физ. пин на Pi)
din = 10             # MOSI / физ. 19
clk = 11             # SCLK / физ. 23
cs = 8               # CE0  / физ. 24
cascaded = 4         # 4 модуля в ряд = 32x8 пикселей
block_orientation = 90
blocks_reverse = true
# rotate: 0=нет, 1=90°, 2=180° (вверх ногами), 3=270°
rotate = 2
test_on_start = true
